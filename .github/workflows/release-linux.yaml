name: Release Linux App
run-name: ${{ github.event.release.tag_name || github.event.inputs.tag }}

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag'
        required: true
        default: '0.0.17'

permissions:
  contents: write

concurrency:
  # The standard and WebKitGTK Linux workflows share the same apt mirrors.
  # Serialize packages for one release to avoid competing apt transactions.
  group: ytgo-linux-release-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Linux App
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        platform:
          - linux/amd64
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Normalise platform tag
        id: normalise_platform
        shell: bash
        run: |
          tag=$(echo ${{ matrix.platform }} | sed -e 's/\//_/g')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Normalise platform arch
        id: normalise_platform_arch
        run: |
          if [ "${{ matrix.platform }}" == "linux/amd64" ]; then
            echo "arch=x86_64" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.platform }}" == "linux/aarch64" ]; then
            echo "arch=aarch64" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalise version tag
        id: normalise_version
        shell: bash
        run: |
          if [ "${{ github.event.release.tag_name }}" == "" ]; then
            version=$(echo ${{ github.event.inputs.tag }} | sed -e 's/v//g')
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            version=$(echo ${{ github.event.release.tag_name }} | sed -e 's/v//g')
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Prepare Ubuntu package sources
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for source in /etc/apt/sources.list.d/*; do
            if [[ -f "$source" && "$source" != *ubuntu* ]]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          apt_sources=(/etc/apt/sources.list /etc/apt/sources.list.d/*ubuntu*)
          for source in "${apt_sources[@]}"; do
            if [[ -f "$source" ]]; then
              sudo sed -i -E 's#https?://[^[:space:]]*ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$source"
            fi
          done

      - name: Install Ubuntu prerequisites
        shell: bash
        run: |
          sudo timeout --signal=TERM --kill-after=30s 10m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=30s 10m apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install --no-install-recommends -y \
            libgtk-4-dev libwebkitgtk-6.0-dev libfuse2t64 dpkg-dev patchelf

      - name: Install Wails 3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Linux executable and AppImage
        shell: bash
        env:
          APP_VERSION: ${{ steps.normalise_version.outputs.version }}
        run: wails3 package

      - name: Create deb package structure
        shell: bash
        run: |
          mkdir -p build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_amd64/DEBIAN
          mkdir -p build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_amd64/usr/local/bin
          mkdir -p build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_amd64/usr/share/applications
          mkdir -p build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_amd64/usr/share/icons/hicolor/512x512/apps

          cat > build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_amd64/DEBIAN/control << EOF
          Package: YT-GO
          Version: ${{ steps.normalise_version.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: ${{ github.repository_owner }} <igeekfan@foxmail.com>
          Depends: libgtk-4-1, libwebkitgtk-6.0-4
          Description: YT-GO video downloader
           A cross-platform YouTube downloader powered by yt-dlp.
          EOF

      - name: Package deb
        shell: bash
        run: |
          cp build/bin/YT-GO build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_amd64/usr/local/bin/
          cp build/appicon.png build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_amd64/usr/share/icons/hicolor/512x512/apps/YT-GO.png

          sed 's#^Exec=YT-GO$#Exec=/usr/local/bin/YT-GO#' build/linux/YT-GO.desktop \
            > build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_amd64/usr/share/applications/YT-GO.desktop

          cd build/linux
          dpkg-deb --build -Zxz "YT-GO_${{ steps.normalise_version.outputs.version }}_amd64"

      - name: Rename files
        shell: bash
        run: |
          mv build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_amd64.deb \
             build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.deb
          mv build/bin/yt-go-${{ steps.normalise_platform_arch.outputs.arch }}.AppImage \
             YT-GO_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform_arch.outputs.arch }}.AppImage

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.normalise_version.outputs.version }}
          files: |
            ./build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.deb
            YT-GO_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform_arch.outputs.arch }}.AppImage
          token: ${{ secrets.GITHUB_TOKEN }}
