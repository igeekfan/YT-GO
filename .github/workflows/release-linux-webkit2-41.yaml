name: Release Linux App
run-name: ${{ github.event.release.tag_name || github.event.inputs.tag }}

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag'
        required: true
      default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Release Linux App
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform:
          - linux/amd64

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Normalise platform tag
        id: normalise_platform
        shell: bash
        run: |
          tag=$(echo ${{ matrix.platform }} | sed -e 's/\//_/g')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Normalise platform arch
        id: normalise_platform_arch
        run: |
           if [ "${{ matrix.platform }}" == "linux/amd64" ]; then
             echo "arch=x86_64" >> "$GITHUB_OUTPUT"
           elif [ "${{ matrix.platform }}" == "linux/aarch64" ]; then
             echo "arch=aarch64" >> "$GITHUB_OUTPUT"
           fi

      - name: Normalise version tag
        id: normalise_version
        shell: bash
        run: |
          if [ "${{ github.event.release.tag_name }}" == "" ]; then
            version=$(echo ${{ github.event.inputs.tag }} | sed -e 's/v//g')
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            version=$(echo ${{ github.event.release.tag_name }} | sed -e 's/v//g')
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Ubuntu prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse-dev libfuse2

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Build frontend assets
        shell: bash
        run: |
          npm install -g npm@9
          jq '.info.productVersion = "${{ steps.normalise_version.outputs.version }}"' wails.json > tmp.json
          mv tmp.json wails.json
          cd frontend
          jq '.version = "${{ steps.normalise_version.outputs.version }}"' package.json > tmp.json
          mv tmp.json package.json
          npm install

      - name: Build wails app for Linux
        shell: bash
        run: |
          CGO_ENABLED=1 wails build -platform ${{ matrix.platform }} \
          -ldflags "-X main.version=v${{ steps.normalise_version.outputs.version }} -X main.gaMeasurementID=${{ secrets.GA_MEASUREMENT_ID }} -X main.gaSecretKey=${{ secrets.LINUX_GA_SECRET }}" \
          -tags webkit2_41 \
          -o YT-GO

      - name: Create deb package structure
        shell: bash
        run: |
          build_dir="build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_amd64"
          mkdir -p "$build_dir/DEBIAN" "$build_dir/usr/local/bin"
          mkdir -p "$build_dir/usr/share/applications"
          mkdir -p "$build_dir/usr/share/icons/hicolor/512x512/apps"
          cat > "$build_dir/DEBIAN/control" << EOF
          Package: YT-GO
          Version: ${{ steps.normalise_version.outputs.version }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: igeekfan <igeekfan@foxmail.com>
          Depends: libwebkit2gtk-4.1-0
          Description: YTGO - Youtube Downloader
           A cross-platform YouTube downloader powered by yt-dlp.
          EOF
          cp build/bin/YT-GO "$build_dir/usr/local/bin/"
          cp build/appicon.png "$build_dir/usr/share/icons/hicolor/512x512/apps/YT-GO.png"
          cat > "$build_dir/usr/share/applications/YT-GO.desktop" << EOF
          [Desktop Entry]
          Name=YT-GO
          Comment=Youtube Downloader
          Exec=/usr/local/bin/YT-GO
          Icon=YT-GO
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

      - name: Package up deb file
        shell: bash
        run: |
          cd build/linux
          dpkg-deb --build -Zxz "YT-GO_${{ steps.normalise_version.outputs.version }}_amd64"

      - name: Rename deb
        working-directory: ./build/linux
        run: mv "YT-GO_${{ steps.normalise_version.outputs.version }}_amd64.deb" "YT-GO_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}_webkit2_41.deb"

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.normalise_version.outputs.version }}
          files: |
            ./build/linux/YT-GO_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}_webkit2_41.deb
          token: ${{ secrets.GITHUB_TOKEN }}
