name: Release macOS App
run-name: ${{ github.event.release.tag_name || github.event.inputs.tag }}

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag'
        required: true
        default: '0.0.18'

permissions:
  contents: write

jobs:
  release:
    name: Release macOS App
    runs-on: macos-latest
    strategy:
      matrix:
        platform:
          - darwin/amd64
          - darwin/arm64
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Normalise platform tag
        id: normalise_platform
        shell: bash
        run: |
          tag=$(echo ${{ matrix.platform }} | sed -e 's/\//_/g' -e 's/darwin/mac/g' -e 's/amd64/intel/g')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM#darwin/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Normalise version tag
        id: normalise_version
        shell: bash
        run: |
          if [ "${{ github.event.release.tag_name }}" == "" ]; then
            version=$(echo ${{ github.event.inputs.tag }} | sed -e 's/v//g')
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            version=$(echo ${{ github.event.release.tag_name }} | sed -e 's/v//g')
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install Wails 3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build macOS application bundle
        shell: bash
        env:
          APP_VERSION: ${{ steps.normalise_version.outputs.version }}
          TARGET_ARCH: ${{ steps.normalise_platform.outputs.arch }}
        run: wails3 package GOARCH="$TARGET_ARCH"

      - name: Checkout create-dmg
        uses: actions/checkout@v4
        with:
          repository: create-dmg/create-dmg
          path: ./build/create-dmg
          ref: master

      - name: Build macOS DMG
        shell: bash
        working-directory: ./build
        run: |
          mkdir -p bin/dmg
          mv bin/YT-GO.app bin/dmg/YTGO.app
          chmod +x dmg/fix-app dmg/fix-app_zh
          ./create-dmg/create-dmg \
            --no-internet-enable \
            --volname "YTGO" \
            --volicon "bin/dmg/YTGO.app/Contents/Resources/icons.icns" \
            --window-pos 400 400 \
            --window-size 660 450 \
            --icon-size 80 \
            --icon "YTGO.app" 180 180 \
            --hide-extension "YTGO.app" \
            --app-drop-link 480 180 \
            --add-file "Repair" "dmg/fix-app" 230 290 \
            --add-file "损坏修复" "dmg/fix-app_zh" 430 290 \
            "bin/YTGO-${{ steps.normalise_platform.outputs.tag }}.dmg" \
            "bin/dmg"

      - name: Rename dmg
        working-directory: ./build/bin
        run: mv "YTGO-${{ steps.normalise_platform.outputs.tag }}.dmg" "YTGO_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.dmg"

      - name: Upload release asset (DMG Package)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.normalise_version.outputs.version }}
          files: ./build/bin/YTGO_${{ steps.normalise_version.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
