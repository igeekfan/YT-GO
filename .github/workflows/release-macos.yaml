name: Release macOS App

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag'
        required: true
        default: '0.0.18'
      use_intel_runner:
        description: 'Build both packages on Intel runners'
        type: boolean
        default: false

run-name: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: write

jobs:
  release:
    name: Release macOS App
    runs-on: ${{ (inputs.use_intel_runner || matrix.platform == 'darwin/amd64') && 'macos-15-intel' || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - darwin/amd64
          - darwin/arm64
    steps:
      - name: Select release tag
        id: tag
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${MANUAL_VERSION#v}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release version such as 0.0.18"
            exit 1
          fi
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Normalise platform tag
        id: normalise_platform
        shell: bash
        run: |
          tag=$(echo ${{ matrix.platform }} | sed -e 's/\//_/g' -e 's/darwin/mac/g' -e 's/amd64/intel/g')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM#darwin/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install Wails 3
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build macOS application bundle
        shell: bash
        env:
          APP_VERSION: ${{ steps.tag.outputs.version }}
          TARGET_ARCH: ${{ steps.normalise_platform.outputs.arch }}
        run: |
          wails3 package GOARCH="$TARGET_ARCH"
          expected_arch=x86_64
          if [[ "$TARGET_ARCH" == "arm64" ]]; then
            expected_arch=arm64
          fi
          test "$(lipo -archs build/bin/YT-GO.app/Contents/MacOS/YT-GO)" = "$expected_arch"

      - name: Checkout create-dmg
        uses: actions/checkout@v4
        with:
          repository: create-dmg/create-dmg
          path: ./build/create-dmg
          ref: master

      - name: Build macOS DMG
        shell: bash
        working-directory: ./build
        run: |
          mkdir -p bin/dmg
          mv bin/YT-GO.app bin/dmg/YTGO.app
          chmod +x dmg/fix-app dmg/fix-app_zh
          ./create-dmg/create-dmg \
            --no-internet-enable \
            --volname "YTGO" \
            --volicon "bin/dmg/YTGO.app/Contents/Resources/icons.icns" \
            --window-pos 400 400 \
            --window-size 660 450 \
            --icon-size 80 \
            --icon "YTGO.app" 180 180 \
            --hide-extension "YTGO.app" \
            --app-drop-link 480 180 \
            --add-file "Repair" "dmg/fix-app" 230 290 \
            --add-file "损坏修复" "dmg/fix-app_zh" 430 290 \
            "bin/YTGO-${{ steps.normalise_platform.outputs.tag }}.dmg" \
            "bin/dmg"

      - name: Rename dmg
        working-directory: ./build/bin
        run: mv "YTGO-${{ steps.normalise_platform.outputs.tag }}.dmg" "YTGO_${{ steps.tag.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.dmg"

      - name: Retain DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTGO_${{ steps.tag.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}
          path: ./build/bin/YTGO_${{ steps.tag.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Upload DMG to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: ./build/bin/YTGO_${{ steps.tag.outputs.version }}_${{ steps.normalise_platform.outputs.tag }}.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
