name: PR CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Type-check and build frontend
        run: npm run build

  go:
    name: Go checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
          check-latest: true
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check Go formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # A pull request may contain Go files committed with CRLF line endings.
          # Normalize the checked-out copy so gofmt checks syntax/formatting rather
          # than the platform-specific line ending representation.
          find . -type f -name '*.go' -print0 | xargs -0 sed -i 's/\r$//'
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Run tests with race detector
        if: runner.os == 'Linux'
        run: go test -race ./internal/...

      - name: Run Windows tests
        if: runner.os == 'Windows'
        # The HTTP integration tests exercise os.Root path confinement and are
        # currently Unix-only under Go 1.27. Compile the package on Windows and
        # run the platform-independent internal test suites here.
        run: |
          go test -run '^$' ./internal/httpapi
          go test ./internal/core ./internal/netpolicy ./internal/platform

      - name: Vet backend and desktop bindings
        run: go vet ./internal/... ./desktop

      - name: Build web server
        run: go build -tags web .
